repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^web-buddy/public/
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor
        args: ["--fix"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
        alias: ec

  - repo: local
    hooks:
      - id: image-budget
        name: Image budget (web-buddy/public/images)
        entry: bash -c 'cd web-buddy && node scripts/check-image-budget.js'
        language: system
        pass_filenames: false
        files: ^web-buddy/public/images/

  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash -c 'cd web-buddy && npx eslint .'
        language: system
        pass_filenames: false
        files: ^web-buddy/src/.*\.(ts|tsx)$
        stages: [pre-commit]
