name: Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-buddy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web-buddy/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: test -d out && test -f out/index.html

      # A commit can reach main through a non-PR path (direct push, since
      # admins are exempt from branch protection and force pushes are
      # allowed), so re-run the e2e suite here rather than trusting that
      # ci.yml's push-triggered run — which races this workflow — passed.
      # Playwright's webServer config (playwright.config.ts) starts and
      # waits for `serve` itself.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - run: touch out/.nojekyll

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: pages-deploy-playwright-report
          path: web-buddy/playwright-report/
          retention-days: 30

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web-buddy/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
