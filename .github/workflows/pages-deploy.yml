name: Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-buddy
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'web-buddy/.nvmrc'
          cache: npm
          cache-dependency-path: web-buddy/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: test -d out && test -f out/index.html

      # A commit can reach main through a non-PR path (direct push, since
      # admins are exempt from branch protection and force pushes are
      # allowed), so re-run the e2e suite here rather than trusting that
      # ci.yml's push-triggered run — which races this workflow — passed.
      # Playwright's webServer config (playwright.config.ts) starts and
      # waits for `serve` itself.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - run: touch out/.nojekyll

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: pages-deploy-playwright-report
          path: web-buddy/playwright-report/
          retention-days: 30

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web-buddy/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
