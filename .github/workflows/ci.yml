name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'web-buddy/.nvmrc'
          cache: 'npm'
          cache-dependency-path: web-buddy/package-lock.json

      - name: Install web-buddy dependencies
        run: npm ci
        working-directory: web-buddy

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece
        with:
          extra-args: "--all-files"
        env:
          SKIP: no-commit-to-branch

  build_and_test:
    needs: prek
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-buddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'web-buddy/.nvmrc'
          cache: 'npm'
          cache-dependency-path: web-buddy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # The browser list is part of the key: a cache saved before Firefox
          # was added holds Chromium only, and restoring it would satisfy the
          # cache-hit check while leaving Firefox missing at test time.
          key: ${{ runner.os }}-playwright-chromium-firefox-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox

      - name: Build Next.js application
        run: npm run build

      # Playwright's webServer config starts/waits for `serve` itself and
      # fails loudly if it doesn't come up, instead of a background `&`
      # step exiting 0 regardless and a 30s curl-poll timeout obscuring
      # the real error.
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        # Uploaded even on a passing job: a test that fails then passes on
        # retry still leaves flake evidence in the report/traces, and that
        # evidence is lost if this only runs on failure().
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web-buddy/playwright-report/
          retention-days: 30

      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: web-buddy/test-results/
          retention-days: 30
