name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: 'web-buddy/.nvmrc'
          cache: 'npm'
          cache-dependency-path: web-buddy/package-lock.json

      - name: Install web-buddy dependencies
        run: npm ci
        working-directory: web-buddy

      - name: Run prek
        uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d
        with:
          extra-args: "--all-files"
        env:
          SKIP: no-commit-to-branch

  build_and_test:
    needs: prek
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-buddy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: 'web-buddy/.nvmrc'
          cache: 'npm'
          cache-dependency-path: web-buddy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js application
        run: npm run build

      # Playwright's webServer config starts/waits for `serve` itself and
      # fails loudly if it doesn't come up, instead of a background `&`
      # step exiting 0 regardless and a 30s curl-poll timeout obscuring
      # the real error.
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        # Uploaded even on a passing job: a test that fails then passes on
        # retry still leaves flake evidence in the report/traces, and that
        # evidence is lost if this only runs on failure().
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web-buddy/playwright-report/
          retention-days: 30

      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: web-buddy/test-results/
          retention-days: 30
